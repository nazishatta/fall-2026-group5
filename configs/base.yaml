seed: 42
device: "cuda" # or "cpu"

dataset:
  name: "mnist"
  batch_size: 64
  num_workers: 2
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15

baseline_model:
  architecture: "lenet5"
  epochs: 20
  lr: 0.001
  feature_layer: "fc2"

som:
  grid_size: [15, 15]
  epochs: 100
  lr_init: 0.5
  sigma_init: 3.0
  neighborhood: "gaussian"
  backend: "numpy" # "numpy" or "cupy"

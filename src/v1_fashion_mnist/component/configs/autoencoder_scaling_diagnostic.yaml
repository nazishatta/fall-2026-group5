# Fashion-MNIST settings. Made from src/v1_mnist/component/configs/autoencoder_scaling_diagnostic.yaml with only
# the dataset-specific values changed (paths, run ID, frozen threshold); protocol:
# src/v1_fashion_mnist/docs/p3_novelty_detection/NOVELTY_DETECTION_PROTOCOL.md
# Triggered diagnostic (protocol section 3; docs/DEVIATIONS.md, 2026-11-21): the autoencoder's SVHN AUROC
# changes strongly with input scaling and training size (0.583 raw, 0.676 standardised, single runs) and
# Isolation Forest is below chance, as on MNIST. One thing is varied at a time: training size and input
# scaling. The design is MNIST's, unchanged; nothing is tuned. Fashion-MNIST validation is the
# in-distribution set and SVHN test the novel set (already seen in earlier runs, so this is exploratory).
# The Fashion-MNIST test split is never opened.
run_id: fashion_mnist_svhn_autoencoder_scaling_diagnostic_s42_46_v1
output_root: outputs/v1_fashion_mnist/p3_novelty_detection/novelty_benchmark
qe_config: src/v1_fashion_mnist/component/configs/qe_ood_evaluation.yaml
seeds: [42, 43, 44, 45, 46]
training_sizes: [10000, 49000]
scalings: [raw, standardized]
target_tpr: 0.95
scoring:
  batch_size: 256
  bootstrap_iterations: 200
  bootstrap_seed: 42
autoencoder:
  input_dim: 84
  hidden_dim: 32
  latent_dim: 16
  epochs: 20
  batch_size: 256
  learning_rate: 0.001
isolation_forest:
  n_estimators: 200
  max_samples: 256
  contamination: 0.05
# Reproduction check against the earlier unified run (reported, not enforced).
reference_metrics: outputs/v1_fashion_mnist/p3_novelty_detection/novelty_benchmark/fashion_mnist_svhn_unified_nine_methods_s42_46_v1/unified_nine_method_metrics.json
expected:
  training_samples: 49000
  validation_samples: 10500
  svhn_samples: 26032
  embedding_dimensions: 84
  som_units: 225
  frozen_training_qe_threshold: 1.4214525859373504

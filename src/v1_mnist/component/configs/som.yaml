# ==============================================================================
# Week 3 Milestone Configuration:
# NNSOM Training & Error Geography Analysis
#
# Inputs loaded from: ./outputs/week_2/embeddings/mnist/
# Outputs saved to:   ./outputs/week_3/
#
# Scientific split policy:
# - SOM is trained only on training embeddings.
# - Validation data is used for development / model selection.
# - Test data is not used for SOM hyperparameter selection.
# ==============================================================================

run:
  name: week_3
  stage: som
  input_run: week_2

som:
  grid_height: 15
  grid_width: 15
  init_neighborhood: 3
  epochs: 100
  steps: 100
  backend: numpy
  random_seed: 42

preprocessing:
  scaler: minmax
  feature_range:
    - -1.0
    - 1.0
  fit_split: train

evaluation:
  development_split: val
  use_test_for_selection: false

analysis:
  hotspot_error_threshold: 0.35
  purity_metric: majority_vote

  visualizations:
    - u_matrix
    - hit_histogram
    - component_planes
    - class_colored_som
    - error_hotspot_overlay

# ==============================================================================
# SOM Milestone Configuration
# NNSOM Training, Model Selection, Convergence Tracking, and Visualization
#
# SOM artifacts are written under ./outputs/v1_mnist/p2_som_training_visualization/
# (som_nnsom_training/, cluster_analysis/, error_pattern_analysis/, interactive_report/)
# ==============================================================================

run:
  name: som
  version: v1_mnist
  stage: som
  input_run: cnn_baseline

# Keep SOM artifacts together and predictable.
paths:
  # Frozen LeNet-5 embeddings. Relative paths start at the code folder, the one that
  # holds src/ (code in src/v1_mnist/component) and outputs/. The layout is the same
  # on EC2 and on a local computer.
  # Every script uses exactly this folder and stops if it is missing (no fallback to another copy).
  embeddings_dir: "./outputs/v1_mnist/p1_model_training_baseline/cnn_baseline_training/embeddings"

  output_dir: "./outputs/v1_mnist/p2_som_training_visualization/som_nnsom_training"
  som_models_dir: "./outputs/v1_mnist/p2_som_training_visualization/som_nnsom_training/som_models"
  logs_dir: "./outputs/v1_mnist/p2_som_training_visualization/som_nnsom_training/logs"
  figures_dir: "./outputs/v1_mnist/p2_som_training_visualization/som_nnsom_training/figures"
  tables_dir: "./outputs/v1_mnist/p2_som_training_visualization/som_nnsom_training/tables"
  analysis_dir: "./outputs/v1_mnist/p2_som_training_visualization/error_pattern_analysis/robustness"
  # Cluster analysis, error pattern analysis and interactive-report outputs (other p2 folders)
  cluster_dir: "./outputs/v1_mnist/p2_som_training_visualization/cluster_analysis"
  error_dir: "./outputs/v1_mnist/p2_som_training_visualization/error_pattern_analysis"
  interactive_report_dir: "./outputs/v1_mnist/p2_som_training_visualization/interactive_report"
  # SOM convergence charts (Plotly HTML). Generated, so not in git; demo/ is a hand-picked
  # showcase, so copy the charts you want to show there yourself.
  convergence_plots_dir: "./outputs/v1_mnist/p2_som_training_visualization/som_nnsom_training/convergence_plots"

# ==============================================================================
# SOM configuration: 15x15 (headline model, instructor-requested)
# Settings from the pre-registered equal-budget comparison
# (docs/p2_som_training_visualization/som_nnsom_training/PREREGISTRATION_grid_comparison.md): each grid tried
# init_neighborhood at 0.20 / 0.47 / 0.73 x side, 250 epochs; 11 was chosen
# for 15x15 by the within-grid rank sum (validation features only).
# ==============================================================================

# Frozen LeNet-5 embeddings used by the grid study and the pre-registered
# grid comparison. train_som.py refuses to run if the files differ.
# Week 3 grid-size table (grid_ablation.py): the three equal-budget runs it compares.
grid_comparison:
  run_ids:
    - som_10x10_nb7_ep250_s42_v2
    - som_15x15_nb11_ep250_s42_v2
    - som_20x20_nb15_ep250_s42_v2

# Week 5 error-pattern robustness check: the other SOMs the headline result is
# checked on, in the order they are reported (each config names its SOM in
# visualization.selected_model).
robustness_check:
  configs:
    - src/v1_mnist/component/configs/som_20x20_robustness.yaml
    - src/v1_mnist/component/configs/som_10x10_robustness.yaml

expected_inputs:
  train_features_sha256: "26faeeac9af896cbd72776b0ad87bc3573218916894d615cedcbdb3c9cd68d65"
  val_features_sha256: "e48dd43f769cbf2988dbfbab80c06d83b6f25e4fdbe39b74bf75472b2521671d"

som:
  grid_height: 15
  grid_width: 15
  init_neighborhood: 11
  epochs: 250
  steps: 250
  backend: auto
  random_seed: 42
  track_qe_history: true
  qe_history_every: 1

preprocessing:
  scaler: minmax
  feature_range:
    - -1.0
    - 1.0
  fit_split: train

evaluation:
  development_split: val
  use_test_for_selection: false

analysis:
  hotspot_error_threshold: 0.35
  purity_metric: majority_vote
  # Week 4 label-shuffle comparison for the validation weighted purity: labels are
  # shuffled across images (each keeps its neuron). Added 2026-10-10 (docs/DEVIATIONS.md).
  purity_null_shuffles: 1000
  purity_null_seed: 20261010
  # Week 4 model check: largest allowed relative difference between the recomputed
  # quantization error and the training run's value (docs/DEVIATIONS.md, 2026-10-10).
  qe_relative_tolerance: 1.0e-6
  # Confusion overlay (cluster_analysis/confusion_overlay.py): how many of the most
  # frequent true -> predicted validation confusions get a map of their own, and how
  # many maps sit in one row of the figure.
  confusion_overlay:
    num_pairs: 3
    panel_columns: 3
  # The one error-hotspot rule: top k = max(min_hotspots, round(hotspot_fraction x
  # neurons)) by Wilson lower bound. Fixed in advance (error_pattern_analysis/
  # HOTSPOT_RULE.md, ERROR_PATTERN_ROBUSTNESS_CRITERIA.md): do not change.
  hotspot_fraction: 0.05
  min_hotspots: 5
  # Error-pattern robustness check. Fixed in advance in
  # ERROR_PATTERN_ROBUSTNESS_CRITERIA.md: do not change.
  robustness:
    split_repeats: 100        # random stratified half-splits of the validation errors
    shuffles: 200             # label-shuffle (permutation) repeats for the chance baseline
    min_errors: 20            # fewer validation errors than this: claims not testable
    split_seed_base: 7000
    shuffle_seed_base: 9000
    alpha: 0.05

visualization:
  selected_model: "som_15x15_nb11_ep250_s42_v2"

  # Use validation labels for class-distribution maps so the visualization
  # reflects generalization rather than only training assignments.
  class_map_split: val

  # Interactive HTML report: at most this many samples of the detail split are
  # embedded for the click-to-inspect panel. A larger split is randomly
  # subsampled with this seed; a smaller one is used whole.
  interactive_max_detail_points: 25000
  interactive_sample_seed: 0

  # For 84 abstract fc2 embedding dimensions, generate detailed histograms
  # only for the most variable dimensions. All 84 dimensions still appear
  # in component-plane outputs.
  top_embedding_features: 6

  # Core NNSOM plots requested for Week 3.
  generate_topology: true
  generate_neuron_connection: true
  generate_u_matrix: true
  generate_hit_histograms: true
  generate_component_planes: true

  # MNIST-relevant adaptations of professor's Iris plotting examples.
  generate_class_color_histograms: true
  generate_class_gray_histograms: true
  generate_feature_color_histograms: true
  generate_feature_gray_histograms: true

  # Additional project-relevant NNSOM plots.
  generate_simple_grid_error_support: true
  generate_simple_grid_purity_support: true
  generate_complex_error_map: true

  # Extra NNSOM plots (pie, stem, histogram, box, violin, scatter, weights) saved in
  # the "extended" folder. On a 15x15 map with 84 embedding features they can look
  # dense. Set to false to skip them; visualize_som.py --extended (Week 3) and
  # cluster_figures.py --extended (Week 4: pie, stem) also turn them on.
  generate_extended_dense_plots: true

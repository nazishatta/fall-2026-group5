# Fashion-MNIST settings. Made from src/v1_mnist/component/configs/svhn_som_overlay.yaml with only the
# dataset-specific values changed (paths, run IDs, frozen hashes); protocol:
# src/v1_fashion_mnist/docs/p3_novelty_detection/NOVELTY_DETECTION_PROTOCOL.md
# Where the SVHN images land on the SOM, which neurons hold the misses, and which training class
# dominates those neurons. Descriptive only.
# Values marked [TBD] come from an earlier Fashion-MNIST step; a script given one stops.
run_id: fashion_mnist_svhn_som_overlay_s42_v1
output_root: outputs/v1_fashion_mnist/p3_novelty_detection/u_matrix_analysis
qe_config: src/v1_fashion_mnist/component/configs/qe_ood_evaluation.yaml
batch_size: 256
hex_radius: 0.56
class_count: 10
min_validation_hits: 5
top_missed_neurons: 10
max_abs_qe_difference: 1.0e-4
expected:
  svhn_samples: 26032
  validation_samples: 10500
  embedding_dimensions: 84
  som_units: 225
  frozen_training_qe_threshold: "[TBD: QE threshold from the qe_novelty summary, filled in after stage 1]"
inputs:
  train_class_neuron: outputs/v1_fashion_mnist/p2_som_training_visualization/cluster_analysis/som_15x15_nb11_ep250_s42/tables/train_class_neuron_intersection.csv
  validation_bmu: outputs/v1_fashion_mnist/p2_som_training_visualization/cluster_analysis/som_15x15_nb11_ep250_s42/assignments/val_bmu.npy
  validation_qe: outputs/v1_fashion_mnist/p2_som_training_visualization/cluster_analysis/som_15x15_nb11_ep250_s42/assignments/val_bmu_distance.npy
  historical_svhn_qe: outputs/v1_fashion_mnist/p3_novelty_detection/novelty_benchmark/fashion_mnist_svhn_five_method_comparison_s42_v1/qe_svhn_test_scores.npy

# Description of the dataset, as configs/dataset/mnist.yaml is for MNIST. The settings the
# code uses are in ../base.yaml.
dataset:
  name: "fashion_mnist"
  num_classes: 10
  channels: 1
  image_size: 28
  feature_dim: 84 # Penultimate dimension for LeNet-5
  ood_dataset: "svhn" # fixed 2026-11-21: docs/p3_novelty_detection/NOVELTY_DETECTION_PROTOCOL.md, section 2

# ==============================================================================
# SOM Milestone Configuration
# NNSOM Training, Model Selection, Convergence Tracking, and Visualization
#
# All SOM artifacts are written under ./outputs/v1_mnist/som/
# ==============================================================================

run:
  name: som
  version: v1_mnist
  stage: som
  input_run: cnn_baseline

# Keep SOM artifacts together and predictable.
paths:
  # Frozen LeNet-5 embeddings, inside this code folder (on EC2:
  # ~/Capstone/Codes/week_7_codes/outputs/v1_mnist/cnn_baseline/embeddings).
  # train_som.py stops if this folder is missing instead of falling back to another copy.
  embeddings_dir: "./outputs/v1_mnist/cnn_baseline/embeddings"
  strict_embeddings_dir: true

  output_dir: "./outputs/v1_mnist/som"
  som_models_dir: "./outputs/v1_mnist/som/som_models"
  logs_dir: "./outputs/v1_mnist/som/logs"
  figures_dir: "./outputs/v1_mnist/som/figures"
  tables_dir: "./outputs/v1_mnist/som/tables"
  analysis_dir: "./outputs/v1_mnist/som/analysis"

# ==============================================================================
# SOM configuration: 15x15 (headline model, instructor-requested)
# Settings from the pre-registered equal-budget comparison
# (docs/som/PREREGISTRATION_grid_comparison.md): each grid tried
# init_neighborhood at 0.20 / 0.47 / 0.73 x side, 250 epochs; 11 was chosen
# for 15x15 by the within-grid rank sum (validation features only).
# ==============================================================================

# Frozen LeNet-5 embeddings used by the grid study and the pre-registered
# grid comparison. train_som.py refuses to run if the files differ.
expected_inputs:
  train_features_sha256: "26faeeac9af896cbd72776b0ad87bc3573218916894d615cedcbdb3c9cd68d65"
  val_features_sha256: "e48dd43f769cbf2988dbfbab80c06d83b6f25e4fdbe39b74bf75472b2521671d"

som:
  grid_height: 15
  grid_width: 15
  init_neighborhood: 11
  epochs: 250
  steps: 250
  backend: auto
  random_seed: 42
  track_qe_history: true
  qe_history_every: 1

preprocessing:
  scaler: minmax
  feature_range:
    - -1.0
    - 1.0
  fit_split: train

evaluation:
  development_split: val
  use_test_for_selection: false

analysis:
  hotspot_error_threshold: 0.35
  purity_metric: majority_vote

visualization:
  selected_model: "som_15x15_nb11_ep250_s42_v2"

  # Use validation labels for class-distribution maps so the visualization
  # reflects generalization rather than only training assignments.
  class_map_split: val

  # For 84 abstract fc2 embedding dimensions, generate detailed histograms
  # only for the most variable dimensions. All 84 dimensions still appear
  # in component-plane outputs.
  top_embedding_features: 6

  # Core NNSOM plots requested for Week 3.
  generate_topology: true
  generate_neuron_connection: true
  generate_u_matrix: true
  generate_hit_histograms: true
  generate_component_planes: true

  # MNIST-relevant adaptations of professor's Iris plotting examples.
  generate_class_color_histograms: true
  generate_class_gray_histograms: true
  generate_feature_color_histograms: true
  generate_feature_gray_histograms: true

  # Additional project-relevant NNSOM plots.
  generate_simple_grid_error_support: true
  generate_simple_grid_purity_support: true
  generate_complex_error_map: true

  # Extra NNSOM plots (pie, stem, histogram, box, violin, scatter, weights) saved in
  # the "extended" folder. On a 15x15 map with 84 embedding features they can look
  # dense. Set to false to skip them; visualize_som.py --extended also turns them on.
  generate_extended_dense_plots: true
